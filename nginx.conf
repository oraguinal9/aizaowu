# AI造物 Nginx 配置（生产服务器 /etc/nginx/conf.d/aizaow.conf）
# 部署到: 23.26.201.180

server {
    listen 80;
    server_name aizaow.com www.aizaow.com;

    location = /baidu_verify_codeva-aREaMJQuiN.html {
        root /var/www/aizaowu/public;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name aizaow.com www.aizaow.com;

    ssl_certificate     /etc/letsencrypt/live/aizaow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aizaow.com/privkey.pem;

    location = /llms.txt { alias /var/www/aizaowu/public/llms.txt; }
    location = /rss.xml  { alias /var/www/aizaowu/public/rss.xml; }

    # 静态资源（Next.js 16 standalone: static 不在 .next/standalone 内）
    location /_next/static/ {
        alias /var/www/aizaowu/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理到 PM2 :3006
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
